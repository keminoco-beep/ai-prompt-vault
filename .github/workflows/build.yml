name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          python tests/test_core.py
          python tests/test_image_meta.py
          python tests/test_v32_langs.py

      - name: Build exe
        shell: pwsh
        run: |
          python -c "import sys, PySide6, PyInstaller; print('py', sys.version.split()[0], '| PySide6', PySide6.__version__, '| PyInstaller', PyInstaller.__version__)"
          python build.py 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host '=== BUILD FAILED — last 80 lines ==='
            Get-Content build_log.txt -Tail 80
            exit 1
          }

      - name: Upload build log (on failure)
        if: failure()
        shell: pwsh
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build_log.txt
          git commit -m "[ci] build log for debugging" --allow-empty
          git push origin HEAD:main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          $exe = "staging/AI-Prompt-Vault-$env:RELEASE_TAG-win64.exe"
          Copy-Item dist/AI绘图资料整理.exe $exe
          # 解压即用 zip：exe + 四语说明书
          Compress-Archive -Path $exe, "docs/使用说明_中文.txt", "docs/README_English.txt", "docs/README_Español.txt", "docs/README_日本語.txt" -DestinationPath "staging/AI-Prompt-Vault-$env:RELEASE_TAG-win64.zip" -Force
          # 英文截图
          Copy-Item docs/screenshots/*.png staging/
          Get-ChildItem staging | ForEach-Object { Write-Output "asset: $($_.Name) $([math]::Round($_.Length/1MB,1))MB" }

      - name: Smoke test exe
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          dist\AI绘图资料整理.exe --selftest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: staging/*

  # Optional: attach the exe to a GitHub Release when a tag like v1.2.3 is pushed
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: staging
      - uses: softprops/action-gh-release@v2
        with:
          files: staging/*
